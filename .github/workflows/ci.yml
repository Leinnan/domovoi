# The checks `just check` and `just test` run locally, on every push and pull
# request: build and test with warnings as errors, the clippy gate, the client
# parity check, and the conformance checks against t3code's own schemas (the
# release in conformance/t3code-pin).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info: the cache stays small and links are faster.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  # Integration tests never index the runner's own agent logs.
  DOMOVOI_AGENT_SESSIONS_HOME: ${{ github.workspace }}/.ci-agent-sessions

jobs:
  reference:
    name: t3code reference checkout
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
      - id: pin
        run: |
          read -r tag commit < <(grep -v '^#' conformance/t3code-pin)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: .reference/t3code
          key: t3code-${{ steps.pin.outputs.commit }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pingdotgg/t3code
          ref: ${{ steps.pin.outputs.commit }}
          path: .reference/t3code
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v4
        with:
          package_json_file: .reference/t3code/package.json
      - if: steps.cache.outputs.cache-hit != 'true'
        working-directory: .reference/t3code
        run: pnpm install --frozen-lockfile
      - name: Golden sessions decode with t3code's schemas
        run: |
          for wire in fixtures/golden/*/wire.ndjson; do node conformance/wire-check.ts "$wire" --quiet; done
      - name: Effect's own RpcClient against effect-rpc
        run: conformance/run.sh

  linux:
    name: Server on Linux
    needs: reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/cache/restore@v4
        with:
          path: .reference/t3code
          key: t3code-${{ needs.reference.outputs.commit }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: System libraries for the status bar icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-dev libxdo-dev libayatana-appindicator3-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests (server, remote, model, contracts, effect-rpc)
        run: |
          DOMOVOI_NODE="$(command -v node)" cargo test --no-fail-fast \
            -p domovoi-server -p domovoi-remote -p domovoi-model -p domovoi-contracts -p effect-rpc

  macos:
    name: Workspace on macOS (just check)
    needs: reference
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/cache/restore@v4
        with:
          path: .reference/t3code
          key: t3code-${{ needs.reference.outputs.commit }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - name: Build, lints and client parity (warnings are errors)
        run: just check
      - name: Tests
        run: DOMOVOI_NODE="$(command -v node)" cargo test --workspace --no-fail-fast

  windows:
    name: Workspace on Windows (WinUI app, server, host)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Git for Windows converts line endings by default; the tests' own
      # repositories expect files written byte for byte.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      # windows-reactor-setup downloads the Windows App SDK runtime on the first build.
      - name: Build with no warning, and the lint gate
        run: just windows-check
      - name: Client parity
        run: just parity
      - name: Unit tests (WinUI app, host, launcher, Iced app, server)
        run: just windows-test
      - name: Server integration tests that run on Windows
        run: just windows-test-server
