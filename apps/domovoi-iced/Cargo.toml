[package]
name = "domovoi-iced"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Domovoi desktop client (Iced): Linux, Windows and macOS"

[features]
# Interactive artifact previews in a window of the app's own (`src/webview.rs`)
# instead of the system browser. Linux needs the WebKitGTK 4.1 and GTK 3
# development packages for it.
webview = ["dep:wry", "dep:tao"]

[[bin]]
name = "domovoi-desktop"
path = "src/main.rs"

[dependencies]
domovoi_core = { path = "../domovoi-core" }
# The core's effects, secure storage and domovoi:// links, shared with the WinUI app.
domovoi-desktop-host = { path = "../../crates/domovoi-desktop-host" }
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "tokio",
    "image",
    "svg",
    "canvas",
    "advanced",
    "fira-sans",
    "linux-theme-detection",
    "web-colors",
    "x11",
    "wayland",
    "advanced-shaping",
    "qr_code",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
arboard = "3"
open = "5"
base64 = "0.22"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jiff = "0.2.42"
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSString"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
iced_test = "0.14"
