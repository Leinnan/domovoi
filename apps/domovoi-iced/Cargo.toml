[package]
name = "domovoi-iced"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Domovoi desktop client (Iced): Linux, Windows and macOS"

[[bin]]
name = "domovoi-desktop"
path = "src/main.rs"

[dependencies]
domovoi_core = { path = "../domovoi-core" }
domovoi-remote = { path = "../../crates/domovoi-remote", default-features = false, features = ["bridge"] }
crux_core = "=0.20.0"
crux_http = "=0.20.0"
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "tokio",
    "image",
    "svg",
    "canvas",
    "advanced",
    "fira-sans",
    "linux-theme-detection",
    "web-colors",
    "x11",
    "wayland",
    "advanced-shaping",
    "qr_code",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
arboard = "3"
open = "5"
dirs = "6"
base64 = "0.22"
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jiff = "0.2.42"
hostname = "0.4"
iana-time-zone = "0.1"
notify-rust = "4"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
iced_test = "0.14"
tempfile = "3"
