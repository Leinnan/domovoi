[package]
name = "domovoi_core"
crate = "domovoi_core"
version = "0.1.0"

[targets.apple]
output = "../domovoi-apple/generated/Shared"
include_macos = true
include_ios = true

[targets.apple.swift]
module_name = "Shared"

[targets.apple.spm]
package_name = "Shared"
layout = "ffi-only"

[targets.android]
output = "../domovoi-android/shared/build/boltffi"
min_sdk = 29
architectures = ["arm64", "x86_64"]

[targets.android.kotlin]
package = "com.crayen.domovoi.ffi"
output = "../domovoi-android/shared/src/main/kotlin"

[targets.android.pack]
output = "../domovoi-android/shared/src/main/jniLibs"
