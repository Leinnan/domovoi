name: Domovoi
packages:
  Shared:
    path: ./generated/Shared
  App:
    path: ./generated/App
options:
  bundleIdPrefix: com.crayen.domovoi
  xcodeVersion: "26.0"
  groupSortPosition: top
  defaultLocalization: en
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # iroh (in the Rust core) needs Network.framework (netwatch) and
    # SystemConfiguration; the Rust static library carries no link hints.
    OTHER_LDFLAGS: [-w, -framework, Network, -framework, SystemConfiguration]
targets:
  Domovoi:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Common
      - path: macOS
    dependencies:
      - package: Shared
      - package: App
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: $(DOMOVOI_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "MIT License"
        NSLocalNetworkUsageDescription: Domovoi finds the shortest path to your remote servers on the local network.
        CFBundleURLTypes:
          - CFBundleURLName: com.crayen.domovoi.connect
            CFBundleURLSchemes: [domovoi]
        # Plain http:// only nearby (the core refuses other addresses too):
        # IP addresses and .local names are exempt; these names are not.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
            lan: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
            internal: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
            home.arpa: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_IDENTITY: "-"
        # Common/AppIcon.icon (tools/icons.py), shared with the iPhone app.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.crayen.domovoi.mac
        DOMOVOI_DISPLAY_NAME: Domovoi
      configs:
        # A debug build is an app of its own to macOS: with the release's
        # bundle id, Launch Services and the Dock mix up the copies (and
        # keep whichever icon they saw first). Its settings and permissions
        # are its own too; servers live in the keychain and carry over.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.crayen.domovoi.mac.debug
          DOMOVOI_DISPLAY_NAME: Domovoi Dev
  DomovoiSmoke:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Smoke
      - path: Common/Core.swift
      - path: Common/SecureStore.swift
      - path: Common/TunnelWorker.swift
    dependencies:
      - package: Shared
      - package: App
    settings:
      CODE_SIGN_IDENTITY: "-"
  DomovoiIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Common
      - path: iOS
        excludes: [Info.plist, DomovoiIOS.entitlements]
      - path: Activity
    dependencies:
      - package: Shared
      - package: App
      - target: DomovoiWidgets
        embed: true
      - target: DomovoiShare
        embed: true
    entitlements:
      path: iOS/DomovoiIOS.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.crayen.domovoi]
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Domovoi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Domovoi scans the pairing QR code your Mac shows, and takes photos you attach to a message.
        NSLocalNetworkUsageDescription: Domovoi looks for a direct path to your Mac on the local network.
        NSSupportsLiveActivities: true
        NSMicrophoneUsageDescription: Domovoi listens while you dictate a message.
        NSSpeechRecognitionUsageDescription: Domovoi turns what you dictate into the text of your message, on this iPhone when it can.
        CFBundleURLTypes:
          - CFBundleURLName: com.crayen.domovoi.connect
            CFBundleURLSchemes: [domovoi]
        # Plain http:// only nearby (the core refuses other addresses too):
        # IP addresses and .local names are exempt; these names are not.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
            lan: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
            internal: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
            home.arpa: { NSIncludesSubdomains: true, NSExceptionAllowsInsecureHTTPLoads: true }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crayen.domovoi
        # The justfile exports the team (`DEVELOPMENT_TEAM=<team> just ios-…`
        # picks another one).
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: iOS/DomovoiIOS.entitlements
        SWIFT_VERSION: "6.0"
        ENABLE_DEBUG_DYLIB: false
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        TARGETED_DEVICE_FAMILY: "1,2"
  DomovoiWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets
        excludes: [Info.plist, DomovoiWidgets.entitlements]
      - path: Activity
    entitlements:
      path: Widgets/DomovoiWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.crayen.domovoi]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Domovoi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crayen.domovoi.widgets
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  DomovoiShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: ShareExtension
        excludes: [Info.plist, DomovoiShare.entitlements]
      - path: Activity
    entitlements:
      path: ShareExtension/DomovoiShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.crayen.domovoi]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Domovoi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 4
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crayen.domovoi.share
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
        CODE_SIGN_STYLE: Automatic
        # Item providers hand back untyped values; the strict checks of
        # Swift 6 have nothing to add in a one-screen extension.
        SWIFT_VERSION: "5.0"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
