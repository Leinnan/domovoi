[package]
name = "ws-tap"
description = "Recording reverse proxy: logs t3code HTTP + WebSocket RPC traffic as NDJSON golden fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
# In workspace builds iroh turns on reqwest's rustls backend without a crypto
# provider; install ring so the client can be built.
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
tokio-tungstenite = "0.30.0"
