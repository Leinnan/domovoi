[package]
name = "domovoi-rpc"
description = "The RPC socket between domovoi-server and its clients"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["server", "axum"]
# The connection loop and router (tokio). Without it only the messages and
# packed frames remain (`message`, `packed`), for the client core.
server = ["dep:futures", "dep:tokio", "dep:tokio-util", "dep:tracing"]
axum = ["server", "dep:axum"]

[dev-dependencies]
divan.workspace = true
# The `frames` bench measures the candidate binary encoding beside JSON.
rmp-serde = "1.3.1"
zstd = "0.14.3"
futures.workspace = true
tokio.workspace = true

[[bench]]
name = "frames"
harness = false

[dependencies]
axum = { workspace = true, optional = true }
# Large frames are sent deflated, in base64 (`packed`). Both are pure Rust.
base64 = "0.23.1"
flate2 = "1.1.11"
futures = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
