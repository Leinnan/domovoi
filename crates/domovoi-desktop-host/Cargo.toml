[package]
name = "domovoi-desktop-host"
description = "Runs domovoi-core on Tokio for the Rust desktop clients (Iced, WinUI): its effects, secure storage and domovoi:// links"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
domovoi_core = { path = "../../apps/domovoi-core" }
domovoi-remote = { path = "../domovoi-remote", default-features = false, features = ["bridge"] }
domovoi-local = { path = "../domovoi-local" }
crux_core = "=0.20.0"
crux_http = "=0.20.0"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
futures = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2.4"
dirs = "6"
hostname = "0.4"
iana-time-zone = "0.1"
notify-rust = "4"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }

[target.'cfg(windows)'.dependencies]
# The AppUserModelID (taskbar grouping, toasts), its registry entries and the links pipe's permissions.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
