[package]
name = "effect-rpc"
description = "Server side of Effect's RPC wire protocol (JSON serialization), compatible with effect/rpc RpcServer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["server", "axum"]
# The connection loop and router (tokio). Without it only the wire types
# (`message`, `frame_parts`) remain, for clients such as the Crux core.
server = ["dep:futures", "dep:tokio", "dep:tokio-util", "dep:tracing"]
axum = ["server", "dep:axum"]

[dev-dependencies]
divan.workspace = true
# The `frames` bench measures the candidate binary encoding beside JSON.
rmp-serde = "1.3.1"
zstd = "0.14.3"
futures.workspace = true
tokio.workspace = true

[[bench]]
name = "frames"
harness = false

[dependencies]
axum = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
